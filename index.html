<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Agent</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            font-weight: 300;
            font-size: 1.5rem;
        }

        #chatBox {
            height: 300px;
            overflow-y: auto;
            background: #0f172a;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
        }

        button {
            padding: 10px 20px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background-color: #2563eb;
        }

        .user-msg {
            color: #60a5fa;
            margin-bottom: 0.5rem;
        }

        .ai-msg {
            color: #10b981;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>AI Text Agent</h1>

        <div id="chatBox"></div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        const appendMessage = (role, text) => {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'user-msg' : 'ai-msg';
            div.innerHTML = `<strong>${role === 'user' ? 'You' : 'AI'}:</strong> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        async function handleSend() {
            const textInput = document.getElementById('userInput');
            const text = textInput.value.trim();
            if (!text) return;

            appendMessage('user', text); // Show your message
            textInput.value = '';

            // Create the AI message bubble early
            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai-msg';
            aiDiv.innerHTML = `<strong>TARS:</strong> <span class="content"></span>`;
            document.getElementById('chatBox').appendChild(aiDiv);
            const contentSpan = aiDiv.querySelector('.content');

            try {
                const response = await fetch('/run_agent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    // Decode the chunk and append it to the bubble
                    const chunk = decoder.decode(value);
                    contentSpan.innerText += chunk;

                    // Auto-scroll
                    const chatBox = document.getElementById('chatBox');
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (err) {
                contentSpan.innerText = "Connection lost.";
            }
        }

        sendBtn.onclick = handleSend;
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>

</html>
